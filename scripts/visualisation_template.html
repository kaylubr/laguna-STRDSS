<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laguna rural location screener</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin:0; height:100%; font:13px/1.45 system-ui, sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { background:rgba(255,255,255,.96); padding:12px 14px 14px; border-radius:12px;
           box-shadow:0 8px 28px rgba(0,0,0,.18); width:260px; max-height:92vh; overflow:auto; }
  .panel h1 { font-size:14px; margin:0 0 2px; letter-spacing:-.02em; }
  .panel h2 { font-size:10px; text-transform:uppercase; letter-spacing:.08em;
              margin:12px 0 6px; color:#667085; }
  .row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .swatch { width:12px; height:12px; border:1px solid rgba(0,0,0,.25); border-radius:3px; flex:0 0 auto; }
  .num { margin-left:auto; font-variant-numeric:tabular-nums; color:#344054; }
  select { width:100%; margin-top:8px; border:1px solid #e4e7ec; border-radius:8px; padding:6px 8px; background:#fff; }
  .muted { color:#667085; font-size:11px; }
  label.row { margin-top:8px; }
  .urban-label { background:transparent; border:0; color:#444; font:600 10px/1.2 system-ui, sans-serif;
                 white-space:nowrap; text-align:center; text-shadow:0 0 3px #fff, 0 0 3px #fff; }
  #forest-modal { position:fixed; inset:0; background:rgba(16,24,40,.45); z-index:2000;
                  display:none; align-items:center; justify-content:center; padding:24px; }
  #forest-modal.open { display:flex; }
  .modal { position:relative; background:#fff; width:min(920px, 100%); max-height:86vh;
           border-radius:16px; box-shadow:0 24px 60px rgba(0,0,0,.28);
           display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,.9fr); overflow:hidden; }
  .modal-main, .modal-tree { min-height:0; overflow:auto; max-height:86vh; }
  .modal-main { padding:22px 22px 20px; }
  .modal-tree { background:#2a3038; border-left:1px solid #1c2128; padding:18px 8px 20px 16px; }
  .kicker { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#98a2b3; }
  .hero { display:flex; align-items:center; gap:10px; margin:6px 0 4px; }
  .hero h2 { font-size:32px; line-height:1; margin:0; letter-spacing:-.04em; }
  .dot { width:16px; height:16px; border-radius:5px; border:1px solid rgba(0,0,0,.18); flex:0 0 auto; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 14px; }
  .chip { font-size:11px; padding:3px 8px; border-radius:99px; background:#f2f4f7; color:#344054; }
  .prob { display:grid; grid-template-columns:78px 1fr 44px; gap:8px; align-items:center; margin:6px 0; }
  .prob span { color:#475467; }
  .track { height:7px; background:#eef1f4; border-radius:99px; overflow:hidden; }
  .track i { display:block; height:100%; border-radius:99px; }
  .prob b { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
  .stat { background:#f7f8fa; border-radius:10px; padding:8px 10px; }
  .stat span { display:block; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:#98a2b3; }
  .stat b { display:block; margin-top:2px; font-size:14px; font-weight:640; font-variant-numeric:tabular-nums; }
  .line { margin:14px 0 0; font-size:12px; color:#475467; }
  .tree-head { color:#c5d0dc; padding-right:36px; margin:0 4px 12px; line-height:1.45; }
  .tree-head b { color:#fff; }
  .step { margin:0 4px; }
  .q, .vote { background:#343c48; border:1px solid rgba(255,255,255,.16); border-radius:12px; padding:8px 10px; }
  .q b, .vote b { display:block; color:#fff; font-size:13px; letter-spacing:-.01em; }
  .q span, .cmp { color:#d5dde6; font-size:12px; font-variant-numeric:tabular-nums; }
  .cmp b { display:inline; font-size:13px; }
  .fork { display:flex; align-items:center; gap:8px; min-height:32px; margin:0 0 0 16px;
          border-left:2px solid #f4f7fb; padding:7px 0 7px 10px; }
  .ans { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
         color:#fff; border-radius:99px; padding:2px 8px; }
  .ans.yes { background:#2f6fed; }
  .ans.no { background:#e06a2c; }
  .side { margin-left:auto; color:#9aa6b2; font-size:10px; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
  .side:before { content:""; display:inline-block; width:16px; height:2px; background:#f4f7fb; margin-right:6px; vertical-align:middle; }
  .vote { border-width:2px; }
  .vote .kicker { margin-bottom:2px; }
  .shares { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:8px; }
  .shares div { background:rgba(255,255,255,.06); border-radius:8px; padding:4px 6px; }
  .shares span { display:block; color:#9aa6b2; font-size:9px; letter-spacing:.05em; text-transform:uppercase; }
  .shares b { font-size:12px; font-variant-numeric:tabular-nums; }
  button.close { position:absolute; top:12px; right:12px; z-index:2; width:28px; height:28px;
                 border:0; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.16);
                 cursor:pointer; font-size:16px; line-height:1; color:#344054; }
  @media (max-width: 760px) {
    .modal { grid-template-columns: 1fr; }
    .modal-tree { border-left: 0; border-top: 1px solid #eceff3; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="forest-modal">
  <div class="modal" id="forest-card"></div>
</div>
<script>
const payload = __PAYLOAD__;

const FIELD_KEYS = {
  rf_high_probability: 'ph',
  rf_moderate_probability: 'pm',
  rf_low_probability: 'pl',
  surrounding_mean_revenue: 'sr',
  surrounding_mean_occupancy: 'so',
  surrounding_listing_count: 'sl',
  distance_to_listed_tourist_place: 'ta',
  listed_places_within_radius: 'pc',
  road_distance_km: 'rd'
};

const map = L.map('map', { preferCanvas: true });
L.tileLayer(
  'https://api.mapbox.com/styles/v1/mapbox/outdoors-v12/tiles/256/{z}/{x}/{y}?access_token=__MAPBOX_TOKEN__',
  {
    maxZoom: 22,
    attribution: '&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }
).addTo(map);
map.fitBounds(payload.bounds, { paddingTopLeft: [20, 20], paddingBottomRight: [290, 20] });

const ruralCells = payload.cells.filter(cell => cell.k === 0);
const classCounts = payload.ruralClasses.map((_, index) =>
  ruralCells.filter(cell => cell.rc === index).length);
const withMarket = ruralCells.filter(cell => cell.sl > 0).length;
const noMarket = ruralCells.length - withMarket;
const ruralLegend = payload.ruralClasses.map((label, index) =>
  `<div class="row"><span class="swatch" style="background:${payload.ruralClassColors[index]}"></span>
   <span>${label}</span><span class="num">${classCounts[index]}</span></div>`).join('');

const info = L.control({ position: 'topright' });
info.onAdd = () => {
  const div = L.DomUtil.create('div', 'panel');
  div.innerHTML = `
    <h1>Rural screener</h1>
    <div class="muted">Weak screen · F1 ${Number(payload.testMacroF1).toFixed(3)} vs guess ${Number(payload.stratifiedMacroF1).toFixed(3)} · High ${payload.highCallsMatched}/${payload.highCallsMade}</div>
    <select id="field">
      <option value="class" selected>Highest probability</option>
    </select>
    <label class="row"><input id="roads" type="checkbox" checked> Roads</label>
    <div id="fieldnote" class="muted"></div>
    <h2>Rural</h2>${ruralLegend}
    <div class="row"><span class="swatch" style="background:#fff;border-style:dashed"></span><span>No market</span><span class="num">${noMarket}</span></div>
    <h2>Not included</h2>
    <div class="row"><span class="swatch" style="background:#fff"></span><span>Urban</span><span class="num">${payload.urbanCells}</span></div>
    <div class="row"><span class="swatch" style="background:transparent"></span><span>Unclassified</span><span class="num">${payload.unclassifiedCells}</span></div>`;
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
info.addTo(map);

const select = document.getElementById('field');
payload.numericFields.forEach(field => {
  const option = document.createElement('option');
  option.value = field.key;
  option.textContent = field.label;
  select.appendChild(option);
});

const ranges = {};
payload.numericFields.forEach(field => {
  const short = FIELD_KEYS[field.key];
  const values = payload.cells.map(cell => cell[short]).filter(value => value !== null && value !== undefined);
  ranges[field.key] = values.length ? [Math.min(...values), Math.max(...values)] : [0, 1];
});

function formatValue(value) {
  if (value === null || value === undefined) return '—';
  return value.toLocaleString();
}

function ramp(t) {
  const stops = [[247,251,255],[198,219,239],[107,174,214],[33,113,181],[8,48,107]];
  const x = Math.min(0.9999, Math.max(0, t)) * (stops.length - 1);
  const i = Math.floor(x), f = x - i;
  const c = stops[i].map((v, k) => Math.round(v + (stops[i + 1][k] - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function formatTreeValue(index, value) {
  if (value === null || value === undefined) return 'blank';
  if (index === 1 || index === 4) return Number(value).toFixed(3);
  if (index === 2 || index === 3) return Math.round(Number(value)).toLocaleString();
  return Number(value).toLocaleString(undefined, { maximumFractionDigits: 1 });
}

const TREE_SHORT = ['Revenue', 'Occupancy', 'Listings', 'Places', 'Place km'];

function treeDiagram(cell) {
  const trace = cell.tp;
  if (!trace || !trace.steps.length) return '';
  const names = payload.ruralClasses;
  const colors = payload.ruralClassColors;
  const leafIndex = trace.leaf.indexOf(Math.max(...trace.leaf));
  const steps = trace.steps.map(step => {
    const feature = TREE_SHORT[step[0]];
    const goLeft = step[4] === 1;
    const answer = goLeft ? 'Yes' : 'No';
    const other = goLeft ? 'No' : 'Yes';
    const comparison = step[1] === 2
      ? '<b>blank</b>'
      : `<b>${formatTreeValue(step[0], step[3])}</b> ${goLeft ? '≤' : '>'} ${formatTreeValue(step[0], step[2])}`;
    return `<div class="step">
      <div class="q"><b>${feature}</b><div class="cmp">${comparison}</div></div>
      <div class="fork"><span class="ans ${answer.toLowerCase()}">${answer}</span><span class="side">${other} · not taken</span></div>
    </div>`;
  }).join('');
  const shares = trace.leaf.map((share, index) =>
    `<div><span>${names[index]}</span><b style="color:${colors[index]}">${share.toFixed(2)}</b></div>`
  ).join('');
  const forestNote = cell.k === 0 && leafIndex !== cell.rc
    ? `<div class="kicker" style="margin-top:8px">Forest vote · ${names[cell.rc]}</div>`
    : '';
  return `<div class="tree-head">Trained to vote <b>Low</b>, <b>Moderate</b>, or <b>High</b>. Tree 1 of 200.</div>
    ${steps}
    <div class="vote" style="border-color:${colors[leafIndex]}">
      <div class="kicker">This vote</div>
      <b style="color:${colors[leafIndex]}">${names[leafIndex]}</b>
      <div class="shares">${shares}</div>
    </div>
    ${forestNote}`;
}

function openForestModal(cell) {
  const names = payload.ruralClasses;
  const colors = payload.ruralClassColors;
  const rural = cell.k === 0;
  const urban = cell.k === 1;
  const title = urban ? 'Urban' : rural ? names[cell.rc] : 'Unclassified';
  const fill = urban ? '#ffffff' : rural ? colors[cell.rc] : 'transparent';
  const probs = [cell.pl, cell.pm, cell.ph];
  const bars = names.map((name, index) => `
    <div class="prob"><span>${name}</span>
      <div class="track"><i style="width:${Math.round(probs[index] * 100)}%;background:${colors[index]}"></i></div>
      <b>${Number(probs[index]).toFixed(2)}</b></div>`).join('');
  const chips = [
    urban ? 'Not included' : rural ? 'Rural' : 'Not included',
    cell.sl > 0 ? 'Market' : 'No market'
  ].map(label => `<span class="chip">${label}</span>`).join('');
  const occupancy = cell.so === null || cell.so === undefined ? '—' : Number(cell.so).toFixed(2);
  const revenue = cell.sr === null || cell.sr === undefined ? '—' : Math.round(cell.sr).toLocaleString();
  const line = urban
    ? 'White on the map. Not in the rural screen.'
    : rural
      ? `Weak screen. ${names[cell.rc] === 'High' ? `High matched ${payload.highCallsMatched} of ${payload.highCallsMade}.` : `F1 ${Number(payload.testMacroF1).toFixed(3)} vs guess ${Number(payload.stratifiedMacroF1).toFixed(3)}.`}`
      : 'No color. Not in the rural screen.';
  document.getElementById('forest-card').innerHTML = `
    <button class="close" type="button" id="forest-close" aria-label="Close">×</button>
    <div class="modal-main">
      <div class="kicker">${cell.m || 'Laguna'} · ${cell.id}</div>
      <div class="hero"><span class="dot" style="background:${fill}"></span><h2>${title}</h2></div>
      <div class="chips">${chips}</div>
      ${bars}
      <div class="stats">
        <div class="stat"><span>Places</span><b>${formatValue(cell.pc)}</b></div>
        <div class="stat"><span>Nearest place</span><b>${formatValue(cell.ta)} km</b></div>
        <div class="stat"><span>Listings</span><b>${formatValue(cell.sl)}</b></div>
        <div class="stat"><span>Revenue</span><b>${revenue}</b></div>
        <div class="stat"><span>Occupancy</span><b>${occupancy}</b></div>
        <div class="stat"><span>Road</span><b>${formatValue(cell.rd)} km</b></div>
      </div>
      <p class="line">${line}</p>
    </div>
    <aside class="modal-tree">${treeDiagram(cell)}</aside>`;
  document.getElementById('forest-modal').classList.add('open');
  document.getElementById('forest-close').addEventListener('click', closeForestModal);
}

function closeForestModal() {
  document.getElementById('forest-modal').classList.remove('open');
}

document.getElementById('forest-modal').addEventListener('click', event => {
  if (event.target.id === 'forest-modal') closeForestModal();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeForestModal();
});

function openCell(cell, event) {
  L.DomEvent.stopPropagation(event);
  openForestModal(cell);
}

const cellLayer = L.layerGroup().addTo(map);
const cellShapes = payload.cells.map(cell => cell.g.map(part => {
  const shape = L.polygon(part, { color: '#444', weight: 0.4, fillOpacity: 0.75 });
  shape.on('click', event => openCell(cell, event));
  if (cell.k === 1) shape.bindTooltip('Urban — not included', { sticky: true });
  shape.addTo(cellLayer);
  return shape;
}));

const urbanLabelLayer = L.layerGroup();
payload.cells.forEach(cell => {
  if (cell.k !== 1) return;
  const ring = cell.g[0][0];
  let lat = 0;
  let lon = 0;
  ring.forEach(point => { lat += point[0]; lon += point[1]; });
  L.marker([lat / ring.length, lon / ring.length], {
    interactive: false,
    keyboard: false,
    icon: L.divIcon({
      className: 'urban-label',
      html: 'Urban · not included',
      iconSize: [118, 14],
      iconAnchor: [59, 7]
    })
  }).addTo(urbanLabelLayer);
});
function syncUrbanLabels() {
  const show = map.getZoom() >= 15;
  const visible = map.hasLayer(urbanLabelLayer);
  if (show && !visible) urbanLabelLayer.addTo(map);
  if (!show && visible) map.removeLayer(urbanLabelLayer);
}
map.on('zoomend', syncUrbanLabels);
syncUrbanLabels();

const listingLayer = L.layerGroup().addTo(map);
payload.listings.forEach(record => {
  const [lon, lat, listingId] = record;
  L.circleMarker([lat, lon], {
    radius: 3, color: '#1d4e89', weight: 1, fillColor: '#4c78a8', fillOpacity: 0.9
  }).bindTooltip(() => `<b>Airbnb listing</b><br>${listingId}<br>${lat.toFixed(5)}, ${lon.toFixed(5)}`)
    .addTo(listingLayer);
});

const roadLayer = L.layerGroup().addTo(map);
if (payload.roads.length) {
  L.polyline(payload.roads, {
    color: '#4a4a4a', weight: 1.1, opacity: 0.75, interactive: false
  }).addTo(roadLayer);
}

const placeLayer = L.layerGroup().addTo(map);
payload.places.forEach(record => {
  const [lon, lat, name] = record;
  L.circleMarker([lat, lon], {
    radius: 4, color: '#7a1f1f', weight: 1, fillColor: '#d62728', fillOpacity: 0.9
  }).bindTooltip(() => `<b>${name}</b><br>poi_laguna.json<br>${lat.toFixed(5)}, ${lon.toFixed(5)}`)
    .addTo(placeLayer);
});

function applyScreen(shape, cell, fill, opacity) {
  if (cell.k === 1) {
    shape.setStyle({
      fillColor: '#ffffff',
      fillOpacity: 1,
      color: '#8d8d8d',
      weight: 0.7,
      dashArray: null
    });
    return;
  }
  if (cell.k !== 0) {
    shape.setStyle({
      fillColor: '#ffffff',
      fillOpacity: 0,
      color: '#c8c8c8',
      weight: 0.4,
      dashArray: null
    });
    return;
  }
  const noMarket = !(cell.sl > 0);
  shape.setStyle({
    fillColor: fill,
    fillOpacity: opacity,
    color: '#333',
    weight: noMarket ? 1.6 : 0.4,
    dashArray: noMarket ? '3 3' : null
  });
}

function styleCells(key) {
  if (key === 'class') {
    cellShapes.forEach((shapes, i) => {
      const cell = payload.cells[i];
      shapes.forEach(shape => applyScreen(shape, cell, payload.ruralClassColors[cell.rc], 0.8));
    });
    return;
  }
  const short = FIELD_KEYS[key];
  const [lo, hi] = ranges[key];
  const span = (hi - lo) || 1;
  cellShapes.forEach((shapes, i) => {
    const cell = payload.cells[i];
    const value = cell[short];
    const color = value === null || value === undefined ? '#d9d9d9' : ramp((value - lo) / span);
    shapes.forEach(shape => applyScreen(shape, cell, color, 0.85));
  });
}

select.addEventListener('change', event => {
  styleCells(event.target.value);
  const field = payload.numericFields.find(f => f.key === event.target.value);
  const note = document.getElementById('fieldnote');
  if (event.target.value === 'class') {
    note.textContent = '';
  } else if (field && field.key === 'road_distance_km') {
    note.textContent = `${ranges[field.key][0].toLocaleString()}–${ranges[field.key][1].toLocaleString()} km · not in the color`;
  } else if (field && field.key.startsWith('distance')) {
    note.textContent = `${ranges[field.key][0].toLocaleString()}–${ranges[field.key][1].toLocaleString()}`;
  } else if (field) {
    note.textContent = `range ${ranges[field.key][0].toLocaleString()} – ${ranges[field.key][1].toLocaleString()}`;
  }
});

styleCells('class');
document.getElementById('roads').addEventListener('change', event => {
  if (event.target.checked) map.addLayer(roadLayer);
  else map.removeLayer(roadLayer);
});
map.on('overlayadd', event => {
  if (event.name === 'Mapped roads') document.getElementById('roads').checked = true;
});
map.on('overlayremove', event => {
  if (event.name === 'Mapped roads') document.getElementById('roads').checked = false;
});
L.control.layers(null, {
  'Grid cells': cellLayer,
  'Mapped roads': roadLayer,
  'Airbnb listings': listingLayer,
  'Places from poi_laguna.json': placeLayer
}, { collapsed: false }).addTo(map);
</script>
</body>
</html>
