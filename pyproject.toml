[project]
name = "str-suitability-laguna"
version = "0.1.0"
description = "STR investment suitability assessment for Laguna, Philippines"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "pyproj>=3.8.0",
    "pyarrow>=25.0.1",
    "mapclassify>=2.11.0",
    "requests>=2.34.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "osmium>=4.3.1",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/str_suitability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
